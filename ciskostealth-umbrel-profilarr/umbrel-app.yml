description: >-
  Profilarr is a configuration management platform for Radarr and Sonarr. Build, test, and deploy quality profiles, custom formats, and media management settings across your media stack.


  **Features:**

  - Link curated databases (Dictionarry, TRaSH Guides, Dumpstarr) or build your own
  - Quality profiles, custom formats, and reusable regular expressions
  - Media management, delay profiles, and quality definitions
  - Sync configurations to any number of Arr instances
  - Automated upgrades, bulk rename, scheduled jobs, and notifications


  **Getting Started:**

  1. Open http://umbrel.local:6868 (or your device IP:6868)
  2. Configure your Radarr/Sonarr instance URLs and API keys
  3. Start building and managing your profiles


  **Setup Requirements:**

  - Sonarr v4+ and/or Radarr v5+ with API access
  - Docker host with Linux kernel 3.17+ (Synology DSM on kernel 3.10 is not supported)


  **Note:** Profilarr v2 is not compatible with v1. Existing v1 databases and configurations cannot be migrated and must be set up fresh.

