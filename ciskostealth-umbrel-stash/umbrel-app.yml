description: >-
  Stash is a self-hosted organizer for your adult media collection, written in Go. It indexes, tags, and organizes your content with an intuitive web interface, automatic metadata scraping, and powerful search and filtering.


  **Features:**

  - Automatic metadata scraping from multiple community sources
  - Powerful search, filtering, and tagging
  - Scene, performer, studio, and tag management
  - Built-in DLNA support for streaming to devices
  - Image and video preview generation
  - Plugin and scraper support


  **Getting Started:**

  1. Open http://umbrel.local:9999 (or your device IP:9999)
  2. Complete the initial setup wizard
  3. Point Stash at your media collection and let it scan


  **Setup Requirements:**

  - A media collection to organize
  - Sufficient storage for metadata, cache, and generated content

