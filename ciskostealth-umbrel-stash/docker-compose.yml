version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: ciskostealth-umbrel-stash_stash_1
      APP_PORT: 9999

  stash:
    image: stashapp/stash:v0.31.1
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "2m"
    environment:
      - STASH_STASH=/data/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/metadata/
      - STASH_CACHE=/cache/
      - STASH_PORT=9999
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${APP_DATA_DIR}/data/config:/root/.stash
      - ${UMBREL_ROOT}/home/Downloads/nsfw:/data
      - ${APP_DATA_DIR}/data/metadata:/metadata
      - ${APP_DATA_DIR}/data/cache:/cache
      - ${APP_DATA_DIR}/data/blobs:/blobs
      - ${APP_DATA_DIR}/data/generated:/generated
